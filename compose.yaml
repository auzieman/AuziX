services:
  builder:
    build:
      context: .
      dockerfile: docker/builder/Dockerfile
    image: auzix/builder:local
    working_dir: /workspace
    environment:
      AUZIX_ROOT_SOURCE: /workspace/out/auzix-strict/AuzixRoot
      AUZIX_ISO_NAME: auzix-strict-shell.iso
    volumes:
      - .:/workspace
      - ./out:/workspace/out
      - ./artifacts:/workspace/artifacts
      - auzix-cache:/root/.cache
    command: ["./scripts/build-auzix-strict-all.sh"]

  shell:
    image: auzix/builder:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./out:/workspace/out
      - ./artifacts:/workspace/artifacts
      - auzix-cache:/root/.cache
    command: ["bash"]
    profiles: ["shell"]

  installer-builder:
    build:
      context: .
      dockerfile: docker/installer-builder/Dockerfile
    image: auzix/installer-builder:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./out:/workspace/out
    command:
      - bash
      - -lc
      - ./scripts/build-auzix-package-tools-package.sh && ./scripts/build-auzix-installer-package.sh && ./scripts/test-auzix-installer.sh
    profiles: ["installer"]

  source-workbench:
    build:
      context: .
      dockerfile: docker/source-workbench/Dockerfile
    image: auzix/source-workbench:local
    working_dir: /workspace
    volumes:
      - ./out:/workspace/out
    command: []
    profiles: ["source-workbench"]

  source-workbench-review:
    build:
      context: .
      dockerfile: docker/source-workbench/Dockerfile
    image: auzix/source-workbench:local
    working_dir: /workspace
    volumes:
      - ./out:/workspace/out
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - /workspace/scripts/source-workbench-boot.sh && echo "source-workbench-review ready; inspect /workspace/out/source-workbench" && sleep infinity
    profiles: ["source-workbench"]

  native-workbench-review:
    image: auzix/native-workbench:phase3
    working_dir: /Work
    volumes:
      - ./out:/Host/out
    command:
      - /bin/bash
      - -lc
      - /Programs/Lua/current/Commands/lua /System/S/system-startup.lua && echo "native-workbench-review ready; inspect /System /Programs /Work or /Host/out/source-workbench" && sleep infinity
    profiles: ["source-workbench"]

  native-workbench-worker:
    image: auzix/native-workbench:phase3
    working_dir: /Work
    environment:
      AUZIX_BASE_PORTS_MODE: plan-only
      AUZIX_BASE_PORTS_OUT: /Host/out/source-workbench/base-ports-worker
      AUZIX_BASE_PORTS_SLEEP_SECONDS: "3600"
    volumes:
      - ./out:/Host/out
    command:
      - /bin/bash
      - -lc
      - /System/Build/Commands/auzix-base-ports-worker
    profiles: ["source-workbench"]

  extended-workbench-worker:
    image: auzix/native-workbench:phase3
    working_dir: /Work
    environment:
      AUZIX_BASE_PORTS_MANIFEST: /System/Build/Manifests/extended-ports.manifest.json
      AUZIX_BASE_PORTS_MODE: plan-only
      AUZIX_BASE_PORTS_OUT: /Host/out/source-workbench/extended-ports-worker
      AUZIX_BASE_PORTS_SLEEP_SECONDS: "3600"
      AUZIX_OLLAMA_URL: http://192.168.1.9:11434
      AUZIX_OLLAMA_MODEL: qwen3.5:latest
    volumes:
      - ./out:/Host/out
    command:
      - /bin/bash
      - -lc
      - /System/Build/Commands/auzix-base-ports-worker
    profiles: ["source-workbench"]

volumes:
  auzix-cache:
